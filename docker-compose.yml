version: '3.8'

services:
  kali:
    build: .
    container_name: kali-linux-mcp
    hostname: kali-mcp
    stdin_open: true
    tty: true
    networks:
      - kali-network
    volumes:
      - kali-data:/root
      - ./shared:/shared
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

networks:
  kali-network:
    driver: bridge

volumes:
  kali-data:
