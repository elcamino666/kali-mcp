version: '3.8'

services:
  kali:
    build: .
    container_name: kali-linux-mcp
    hostname: kali-mcp
    stdin_open: true
    tty: true
    network_mode: "host"
    volumes:
      - kali-data:/root
      - ./shared:/shared
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

volumes:
  kali-data:
